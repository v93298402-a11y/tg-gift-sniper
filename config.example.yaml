# ───────────────────────────────────────────────
# tg-gift-sniper — configuration
# ───────────────────────────────────────────────

# Polling interval in seconds.
# Lower = faster reaction, but higher risk of FLOOD_WAIT.
# Recommended: 2-5 for moderate speed, 1 for aggressive.
poll_interval: 3

# Dry-run mode: if true, the bot logs what it *would* buy but does not purchase.
dry_run: true

# Maximum Stars balance you're willing to spend per single purchase.
# If a gift costs more than this, it will be skipped even if it's below floor.
max_spend_per_buy: 5000

# Targets — list of gift collections to monitor.
# gift_id: the base gift ID (run: python -m sniper --list-gifts to see IDs)
# max_price: buy if resale price <= this value (in Stars or TON nanos)
# name: human-readable label for logs
# pay_with_ton: false (default, pay with Stars) or true (pay with TON)
# model: filter by model name (run: python -m sniper --list-models GIFT_ID)
# pattern: filter by pattern name (optional)
# backdrop: filter by backdrop name (optional)
targets:
  - gift_id: 6202085688049584129
    max_price: 500
    name: "Plush Pepe"
    pay_with_ton: false

  # Filter by specific model:
  # - gift_id: 6014591077976114307
  #   max_price: 200
  #   name: "Snoop Dogg Goldizzle"
  #   model: "Goldizzle"
  #   pay_with_ton: true

# ─── Third-party marketplace monitoring ────────
# Monitor Tonnel, MRKT, Portals for underpriced gifts.
# Notifications only (no auto-buy). Add MRKT_TOKEN / PORTALS_TOKEN to .env.
# Tonnel needs no auth.
market_targets: []
  # - gift_name: "Plush Pepe"
  #   max_price: 5.0          # TON
  #   model: "Albino"         # optional
  #   markets: ["tonnel", "mrkt", "portals"]

# Notification settings (optional).
# notify_chat_id: Telegram chat/user ID where purchase alerts are sent.
# Leave empty or remove to disable notifications.
notify_chat_id: null

# Logging level: DEBUG, INFO, WARNING, ERROR
log_level: INFO
