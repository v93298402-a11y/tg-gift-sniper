[project]
name = "tg-gift-sniper"
version = "0.1.0"
description = "Telegram collectible gift sniper — polls resale market and auto-buys below target price"
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.37",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "python-telegram-bot>=21.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
]

[project.scripts]
tg-sniper = "sniper.__main__:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
